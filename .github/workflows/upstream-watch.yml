# Upstream watch: once a week, compare pedroslopez/whatsapp-web.js (the library our WhatsApp agents fork; base 1.34.7)
# with the last check - releases, the npm "latest" tag and commits on upstream main - and open an issue in this repo
# when anything changed, @mentioning NOTIFY so it arrives as a GitHub notification / e-mail even when nobody is
# looking. A failed run opens an issue too. State = upstream-watch/state.json, committed only when it changes.
# Read-only towards upstream; the issue and the state commit use the built-in GITHUB_TOKEN.
name: Upstream watch

on:
    schedule:
        # Mondays 01:23 UTC (10:23 KST). Off the top of the hour: minute :00 is peak load (see archive.yml).
        - cron: '23 1 * * 1'
    workflow_dispatch:

permissions:
    contents: write
    issues: write

concurrency:
    group: upstream-watch
    cancel-in-progress: false

env:
    NOTIFY: '@Mugen-Houyou'

jobs:
    watch:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Compare upstream with the last check
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const statePath = 'upstream-watch/state.json';
                      const owner = 'pedroslopez';
                      const repo = 'whatsapp-web.js';
                      const prev = fs.existsSync(statePath) ? JSON.parse(fs.readFileSync(statePath, 'utf8')) : null;

                      const releases = (await github.rest.repos.listReleases({ owner, repo, per_page: 10 })).data.map((r) => ({
                          tag: r.tag_name,
                          date: (r.published_at || '').slice(0, 10),
                          url: r.html_url,
                          pre: r.prerelease,
                      }));
                      const head = (await github.rest.repos.getBranch({ owner, repo, branch: 'main' })).data.commit.sha;
                      const npmRes = await fetch('https://registry.npmjs.org/whatsapp-web.js');
                      if (!npmRes.ok) throw new Error(`npm registry HTTP ${npmRes.status}`);
                      const npmLatest = (await npmRes.json())['dist-tags'].latest;

                      const known = new Set(prev ? prev.releases : []);
                      const newReleases = prev ? releases.filter((r) => !known.has(r.tag)) : [];
                      let newCommits = [];
                      if (prev && prev.mainSha !== head) {
                          const cmp = await github.rest.repos.compareCommits({ owner, repo, base: prev.mainSha, head });
                          newCommits = cmp.data.commits.map((c) => ({
                              sha: c.sha.slice(0, 7),
                              date: c.commit.committer.date.slice(0, 10),
                              title: c.commit.message.split('\n')[0],
                              url: c.html_url,
                          }));
                      }
                      const npmChanged = prev && prev.npmLatest !== npmLatest;
                      if (prev && !newReleases.length && !newCommits.length && !npmChanged) {
                          core.info(`no upstream change since ${prev.checkedAt} (main ${head.slice(0, 7)}, npm ${npmLatest})`);
                          return;
                      }

                      fs.mkdirSync('upstream-watch', { recursive: true });
                      fs.writeFileSync(
                          statePath,
                          JSON.stringify({ checkedAt: new Date().toISOString(), mainSha: head, npmLatest, releases: releases.map((r) => r.tag) }, null, 2) + '\n',
                      );

                      const notify = process.env.NOTIFY;
                      const lines = [];
                      let title;
                      if (!prev) {
                          title = `[upstream-watch] 감시 시작 - whatsapp-web.js npm ${npmLatest}, main ${head.slice(0, 7)}`;
                          lines.push(`${notify} 업스트림 감시를 시작했습니다. 이 이슈가 알림으로 도착했다면 경로가 동작하는 것입니다. 닫아도 됩니다.`, '');
                          lines.push(`- npm latest: \`${npmLatest}\``, `- upstream main: \`${head.slice(0, 7)}\``);
                          lines.push(`- 최근 릴리스: ${releases.slice(0, 3).map((r) => `[${r.tag}](${r.url}) (${r.date})`).join(', ')}`);
                      } else {
                          const parts = [];
                          if (newReleases.length) parts.push(`새 릴리스 ${newReleases.map((r) => r.tag).join(', ')}`);
                          if (npmChanged) parts.push(`npm latest ${prev.npmLatest} -> ${npmLatest}`);
                          if (newCommits.length) parts.push(`main 커밋 ${newCommits.length}개`);
                          title = `[upstream-watch] whatsapp-web.js: ${parts.join(' / ')}`;
                          lines.push(`${notify} whatsapp-web.js 업스트림에 지난 확인(${prev.checkedAt.slice(0, 10)}) 이후 변경이 있습니다.`, '');
                          if (newReleases.length) {
                              lines.push('### 새 릴리스', ...newReleases.map((r) => `- [${r.tag}](${r.url}) ${r.date}${r.pre ? ' (pre-release)' : ''}`), '');
                          }
                          if (npmChanged) lines.push('### npm', `- latest: \`${prev.npmLatest}\` -> \`${npmLatest}\``, '');
                          if (newCommits.length) {
                              lines.push(`### main 새 커밋 (${newCommits.length})`, ...newCommits.slice(-50).map((c) => `- [${c.sha}](${c.url}) ${c.date} ${c.title}`), '');
                          }
                          lines.push(
                              '### 할 일',
                              '- [ ] Claude 세션에서 "업스트림 변경 검토" 요청: 우리 포크(1.34.7 기반, templlm\\fleet-unify\\repo main)와 비교, 영향, 이식 여부',
                              '- [ ] 정식 릴리스(>1.34.7)라면: 우리 `$1` 백포트(업스트림 PR #201840, 미병합)를 공식 수정(#201832)으로 교체 검토',
                              '- [ ] WhatsApp 수신/발신, 사진 저장에 관련된 수정인지 확인',
                          );
                      }
                      lines.push('', `<sub>자동 생성: ${context.workflow} run [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})</sub>`);
                      const issue = await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body: lines.join('\n') });
                      core.info(`opened issue #${issue.data.number}: ${title}`);

            - name: Save the state
              run: |
                  if [ -z "$(git status --porcelain)" ]; then
                      echo "State unchanged - nothing to commit."
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add upstream-watch/state.json
                  git commit -m "chore: upstream watch state"
                  git push

            - name: Report a failed run
              if: failure()
              uses: actions/github-script@v7
              with:
                  script: |
                      await github.rest.issues.create({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          title: '[upstream-watch] 확인 작업 실패',
                          body: `${process.env.NOTIFY} 업스트림 확인 작업이 실패했습니다. 로그: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                      });
